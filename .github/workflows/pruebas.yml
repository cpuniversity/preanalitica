# Integración continua: en cada push, GitHub revisa el estilo del código con
# flake8 y corre las pruebas automáticas. Si flake8 da algún aviso o alguna
# prueba falla, GitHub lo marca con una cruz roja en el commit.
# Las pruebas usan exámenes inventados y una base temporal: no necesitan el
# listado real, la base de data/ ni el archivo .env, y nunca envían correos.

name: Pruebas

on:
  push:
  # Permite correrlas a mano desde la pestaña "Actions" de GitHub
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar las librerías del proyecto
        run: pip install -r requirements.txt

      - name: Revisar el estilo con flake8
        run: flake8 --count --show-source --statistics

      - name: Correr las pruebas
        run: pytest -v
